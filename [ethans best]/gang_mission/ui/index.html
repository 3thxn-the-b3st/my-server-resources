<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gang Mission HUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Roster / Timer HUD (Lower Right) -->
    <div id="raid-hud" class="hud-container hidden">
        <div class="hud-header">
            <div class="hud-title">
                <i class="fa-solid fa-warehouse header-icon"></i>
                <span>WAREHOUSE RAID</span>
            </div>
            <div id="hud-status-badge" class="status-badge lobby">LOBBY</div>
        </div>

        <div class="timer-container">
            <span class="timer-label"><i class="fa-solid fa-stopwatch"></i> TIME REMAINING</span>
            <span id="hud-timer" class="timer-value">00:30</span>
        </div>

        <div class="hud-divider"></div>

        <div class="roster-section">
            <div class="roster-header">
                <span>OPERATIONAL CREW</span>
                <span id="roster-count" class="roster-count">(0)</span>
            </div>
            <ul id="participant-list" class="participant-list">
            </ul>
        </div>

        <div id="hud-footer-hint" class="hud-footer hidden">
            <i class="fa-solid fa-keyboard"></i> PRESS <span class="key-bind">G</span> TO JOIN OPERATION
        </div>
    </div>

    <!-- Ambush Progress Tracker Widget (Upper Right) -->
    <div id="ambush-tracker" class="tracker-container hidden">
        <div class="tracker-header">
            <i class="fa-solid fa-shield-halved tracker-header-icon"></i>
            <span>AMBUSH CLEARANCE</span>
        </div>
        <div class="tracker-body">
            <span class="tracker-label">POLICE REMAINING:</span>
            <span id="ambush-count" class="tracker-value">0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
